# Хуки клієнтські: `git commit --no-verify` знімає їх повністю, і коміт із
# чужої машини теж їх не бачив. Це — єдина перевірка, яку не можна обійти
# локально.
name: template-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Повна історія: крок «Commit subjects» читає теми всіх комітів
          # push-у / PR-у, а не лише HEAD.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Другий, незалежний примірник контрольної суми.
      # scripts/integrity.sha256 пінить усі enforcement-файли, але сам маніфест
      # ним не покритий — інакше вийшло б коло. Тому його хеш зашитий тут.
      # Наслідок: щоб протягнути змінену перевірку, треба змінити ще й цей
      # рядок, і воно видно в diff.
      - name: Manifest pin
        run: |
          expected="8ab4bce96f215a5a5529e71012a7e3cb262e4b4f09c795b5ba261406df0fd3ec"
          actual=$(sha256sum scripts/integrity.sha256 | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "scripts/integrity.sha256 змінився, а пін у цьому workflow — ні."
            echo "  очікувано: $expected"
            echo "  фактично:  $actual"
            echo "Якщо зміна погоджена — онови рядок expected тим самим комітом."
            exit 1
          fi

      # Звірка маніфесту штатним sha256sum, незалежно від наших скриптів:
      # переписаний check-template.py сказав би OK про себе самого.
      - name: Verify pinned files
        run: sha256sum -c scripts/integrity.sha256

      # У CI хуки не налаштовані й не потрібні — core.hooksPath задається,
      # щоб перевірка не падала на пункті, який стосується робочої машини.
      - name: Set hooks path
        run: git config core.hooksPath .githooks

      - name: Template integrity
        run: python3 scripts/check-template.py

      - name: Traceability IDs
        run: python3 scripts/check-ids.py

      # Дубль .githooks/commit-msg на сервері: до цього кроку traceability
      # «до коміту» трималася лише клієнтським хуком, і `--no-verify` (або
      # будь-який його обхід) клав у main коміт без ID, а CI був зелений.
      # Ті самі два grep -E, що в хуку. Merge-коміти виключено (--no-merges) —
      # у хуку це MERGE_HEAD; Revert звільнено від типу, але не від ID.
      # Кореневий коміт виключено (--min-parents=1): у проєкті, створеному
      # через «Use this template», його пише GitHub, з темою «Initial commit»,
      # і перший же прогін CI був червоним без жодної помилки власника.
      # Переписати його можна лише force-push-ем — гірше за будь-який обхід.
      - name: Commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PR: усе між базою і HEAD. Push: між before і sha. Нова гілка
          # (before = 0000…): усе, чого немає в основній гілці, — раніше лише
          # HEAD, і решта комітів нової гілки не перевірялася зовсім; перший
          # push самої основної гілки — уся її історія (кореневий коміт однаково
          # виключено нижче). before, якого вже немає (force push), — лише HEAD.
          new_branch=0
          echo "$BEFORE" | grep -qE '^0+$' && new_branch=1
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$new_branch" = 0 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          elif [ "$new_branch" = 1 ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            range="${{ github.sha }}"
          elif [ "$new_branch" = 1 ] \
               && git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null; then
            range="origin/$DEFAULT_BRANCH..${{ github.sha }}"
          else
            range="-1 HEAD"
          fi
          echo "перевіряю: $range"
          fail=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              'Revert "'*) ;;
              *)
                if ! printf '%s' "$msg" | grep -qE '^(feat|fix|refactor|test|docs|chore|build|ci|revert)(\([a-z0-9-]+\))?: '; then
                  echo "немає '<type>: ' у темі коміту: $msg"; fail=1; continue
                fi ;;
            esac
            if ! printf '%s' "$msg" | grep -qE '(^|[^A-Za-z0-9-])(FR|DR|NFR|IR|TASK|SLICE)-[0-9]{3}([^0-9-]|$)'; then
              echo "немає ID вимоги або задачі в темі коміту: $msg"; fail=1
            fi
          done < <(git log --no-merges --min-parents=1 --format=%s $range)
          if [ "$fail" != 0 ]; then
            echo "Клієнтський commit-msg це ловить; --no-verify його зняв. CI не приймає коміт без ID."
            echo "Тему вже запушеного коміту не виправити без переписування історії й force-push —"
            echo "це рішення власника (правила, розділ Environments), не агента."
            exit 1
          fi

      # Правила зберігаються в LF. Якщо в репозиторій просочився CRLF —
      # хеші зламаються у наступного, хто клонує.
      - name: Line endings
        run: |
          if grep -qU $'\r' RulesForAIVibeCoding.md; then
            echo "RulesForAIVibeCoding.md містить CRLF — має бути LF (див. .gitattributes)"
            exit 1
          fi
